[project]
name = "acggr-py"
dynamic = ["version"]
description = "Acggr - a standalone script toolset (danbooru / pawchive / cbg / jsoneri / aria2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6",
    "PySide6-Fluent-Widgets",
    "httpx[http2]",
    "httpcore>=1.0.9",
    "pysidesix-frameless-window>=0.8.2",
    "shiboken6>=6.12.0",
    "pywin32>=312; sys_platform == 'win32'",
    "redis",
    "pandas",
    "loguru",
    "PyYAML",
    "colorama",
    "tqdm",
    "polib",
    "dnspython>=2.9.0",
    "aiofiles>=25.1.0",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pillow-avif-plugin>=1.6.0",
    "psutil>=7.2.2",
    "curl-cffi>=0.16.3",
    "py7zr>=1.1.4",
    "rich>=15.0.0",
    "mutagen>=1.47",
    "ruff>=0.17.5",
]
authors = [
    {name = "jsoneri", email = "jsoneri@outlook.com"},
]
keywords = ["acg", "script", "downloader", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app/",
    "core/",
    "ui/",
    "res/",
    "deploy/",
    "docs/public/*.png",
    "acggr.py",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.version]
path = "core/variables.py"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Repository = "https://github.com/jasoneri/acggr"
Documentation = "https://github.com/jasoneri/acggr#readme"
Changelog = "https://github.com/jasoneri/acggr/releases"
Releases = "https://github.com/jasoneri/acggr/releases"

[project.gui-scripts]
acggr = "app:start"
acggr-py = "app:start"

[project.scripts]
acggr-cli = "app:check"
