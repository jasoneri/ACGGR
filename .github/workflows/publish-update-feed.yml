name: Publish Update Feed

# Rewrites the machine-readable feed on the permanent `updater` release tag.
# Clients poll one fixed URL, so this workflow -- not the versioned release --
# owns that URL:
#   https://github.com/<repo>/releases/download/updater/update.json
#
# Manual / repair entry point. The *automatic* refresh after a tag push lives
# inline in `release.yml`: a release created with the repo's GITHUB_TOKEN does
# not cascade a `release` event, and this file is hidden from plain `git add` by
# a developer-level global ignore (`.*/`), so the critical path must not depend
# on it. This workflow covers:
#   - `workflow_dispatch`: backfill after a missed publish, or roll the feed back
#     to an older tag;
#   - `release: [published, prereleased]`: releases published by a human or by
#     another token.
on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The feed release itself has tag `updater`, which is not a version: a
    # human re-publishing that release must not feed its own tag back in.
    if: github.event_name != 'release' || github.event.release.tag_name != 'updater'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          CALL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Dispatch input, then the reusable-workflow input, then the release
          # event. Empty for every path that has nothing to publish.
          tag="${DISPATCH_TAG:-${CALL_TAG:-$EVENT_TAG}}"
          if [ -z "$tag" ]; then
            echo "::error::no tag resolved (release event had no tag_name and no input)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $tag"

      - name: Fetch release body and timestamp
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh api` failure is fatal on purpose: an empty body would silently
          # publish a feed without notes, which looks like a client bug later.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, os, pathlib, sys

          work = pathlib.Path(sys.argv[1])
          data = json.loads((work / "release.json").read_text(encoding="utf-8"))
          body = data.get("body") or ""
          (work / "body.md").write_text(body, encoding="utf-8")
          published_at = data.get("published_at") or ""
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"published_at={published_at}\n")
          print(f"body_chars={len(body)} published_at={published_at}")
          PY

      - name: Compose feed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PUBLISHED_AT: ${{ steps.notes.outputs.published_at }}
        run: |
          set -euo pipefail
          python3 deploy/scripts/compose_update_feed.py \
            --tag "$TAG" \
            --body-file "$RUNNER_TEMP/body.md" \
            --published-at "$PUBLISHED_AT" \
            --repo "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/update.json"

      - name: Ensure the permanent updater release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view updater >/dev/null 2>&1; then
            echo "updater release already exists"
          else
            # Created once; every later run clobbers only update.json. Releases
            # created with GITHUB_TOKEN do not cascade `release published`
            # events, so this cannot re-enter the workflow.
            gh release create updater \
              --title "updater" \
              --notes "Machine-readable update feed for shipped clients. Do not delete: update.json is polled at a fixed URL." \
              --latest=false
          fi

      - name: Upload feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload updater "$RUNNER_TEMP/update.json" --clobber

      - name: Verify the public feed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/updater/update.json"
          # The asset CDN can lag a few seconds behind the API; retry instead of
          # reporting a red build for a cache miss.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --retry-delay 2 "$url" -o "$RUNNER_TEMP/public.json"; then
              break
            fi
            echo "attempt ${attempt}: feed not reachable yet"
            sleep 3
          done
          test -s "$RUNNER_TEMP/public.json"
          python3 - "$RUNNER_TEMP/public.json" <<'PY'
          import json, os, pathlib, sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          required = {"version", "channel", "published_at", "notes", "release_url"}
          missing = sorted(required - data.keys())
          assert not missing, f"feed missing keys: {missing}"
          # The fixed URL is a shared mutable address: a stale asset (CDN cache or
          # a rollback someone forgot) would look fine field-wise, so compare the
          # advertised version with the tag this run was told to publish.
          expected = os.environ["TAG"].strip().lstrip("vV")
          assert data["version"] == expected, f"feed version {data['version']!r} != tag {expected!r}"
          assert data["channel"] in ("stable", "preview"), f"bad channel: {data['channel']!r}"
          print(f"feed ok: version={data['version']} channel={data['channel']}")
          PY
          echo "feed published for ${TAG}: $url"